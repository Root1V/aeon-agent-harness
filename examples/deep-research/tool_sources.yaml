# TOOL-010 · Fuentes de tools MCP externas (AEON_TOOL_SOURCES_PATH).
#
# ESTE FICHERO SE COMITEA, y por eso las credenciales se nombran y nunca se escriben: `client_id_env`
# y `client_secret_env` llevan el NOMBRE de una variable de entorno. El cargador se niega a aceptar
# algo que no parezca un nombre de variable, porque la forma más probable de equivocarse en ese campo
# es pegar el secreto.
#
# CADA TOOL LA APRUEBA UNA PERSONA, UNA A UNA. `tools/list` de una fuente reporta nombre, descripción
# y schema — nunca el efecto, ni el riesgo, ni qué argumentos forman una clave de idempotencia. Una
# fuente que se clasificara a sí misma volvería opcional la regla de ADR-0001: declararlo todo
# READ_ONLY y deja de aplicar. Un tool que la fuente ofrece y aquí no está, no se sirve.
#
# EL FLUJO DEL `descriptor_sha256`, que es lo único no obvio de este fichero:
#   1. Declara la fuente y el tool SIN el digest (déjalo vacío o fuera).
#   2. Arranca aeon-toolgw una vez. El log imprime el digest observado y NO sirve el tool.
#   3. Revisa ese descriptor y, si es aceptable, pega el digest aquí.
# (Este flujo NO funcionaba hasta `TOOL-010b`: el cargador rechazaba el digest vacío y el gateway
#  salía antes de conectarse, así que el log del paso 2 nunca se escribía. Lo encontró Veritium
#  siguiendo estas mismas instrucciones.)
# A partir de ahí, si la fuente cambia el descriptor —el schema, o su significado con el mismo
# schema— ese tool deja de servirse y el log vuelve a imprimir el nuevo digest. El resto de la fuente
# sigue sirviéndose.
#
# POR QUÉ PUERTA SE GOBIERNA POR AGENTE, Y POR CUÁL NO. Esto hay que leerlo antes de escribir
# permisos, y lo corrige Veritium sobre lo que habíamos dicho de más:
#   · `POST /execute` → Cedar ve el AGENTE (`agent_manifest_ref`), así que un permiso por agente se
#     aplica como esperas.
#   · `/mcp` → Cedar ve SIEMPRE `McpClient::"external-mcp-client"`, llame quien llame. Es la
#     limitación de `INT-003` (el `clientInfo` de MCP no está verificado por el protocolo y no se
#     puede usar para seguridad), y significa que un permiso por agente NO se aplica por `/mcp`.
#     Hacen falta dos permisos: uno por agente para `/execute` y uno para todo cliente MCP.
#
# LO QUE AEON NO PUEDE HACER POR TI: un tool federado NO está aislado por tenant ALLÍ. La llamada sale con la credencial de Aeon y la fuente
# no conoce nuestros tenants. Si un tool devuelve datos específicos de un tenant, ese aislamiento
# tiene que existir en la fuente; aprobarlo sin eso entrega los datos de un tenant a otro por una
# puerta que Cedar abre con gusto.
kind: ToolSourceBundle
sources:
  - id: veritium
    endpoint: https://veritium.example.test/mcp
    # El prefijo lo fija la fuente REGISTRADA, no el servidor remoto: es lo único que impide que dos
    # fuentes que ofrezcan `search.web` colisionen, y no se puede delegar en quien colisiona.
    prefix: veritium.
    refresh: 60s
    # allow_plain_http: true  # solo si has decidido aceptar http en claro a un host NO loopback.
    #   Cubre LAS DOS urls —`endpoint` y `auth.token_url`— y eso importa: por el endpoint viaja un
    #   bearer derivado, y por el token_url viaja el CLIENT SECRET del que se acuña. Las dos se
    #   registran en el log en cada arranque, con avisos distintos. Cubrir solo una dejaba a
    #   Veritium necesitando su puente socat, que es lo que esta excepción venía a retirar.
    #   El caso real: la fuente en el host y toolgw en Docker (`host.docker.internal`).
    auth:
      token_url: https://veritium.example.test/oauth2/token
      client_id_env: AEON_VERITIUM_MCP_CLIENT_ID
      client_secret_env: AEON_VERITIUM_MCP_CLIENT_SECRET
      scopes: [tools:call]
    tools:
      - name: extract_document
        side_effect: READ_ONLY
        risk: low
        descriptor_sha256: "" # ver el flujo de arriba: arranca una vez y pega el digest del log
      - name: validate_case
        side_effect: READ_ONLY
        risk: low
        descriptor_sha256: ""
