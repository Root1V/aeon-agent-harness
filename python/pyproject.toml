[project]
name = "aeon-worker"
version = "0.1.0"
description = "Aeon agent harness — Temporal worker, context/evidence/memory layers, Deep Research profile."
requires-python = ">=3.13"
dependencies = [
    "temporalio>=1.8.0",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    # aeon_evalops.runner (EVAL-002, not a test) parses evals/suites/*.yaml at runtime — not dev-only.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "referencing>=0.35",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "aeon_sdk",
    "aeon_worker",
    "aeon_context",
    "aeon_evidence",
    "aeon_memory",
    "aeon_adapters",
    "aeon_profiles",
    "aeon_evalops",
]
