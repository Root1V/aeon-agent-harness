[project]
name = "aeon-worker"
version = "0.1.0"
description = "Aeon agent harness — Temporal worker, context/evidence/memory layers, Deep Research profile."
requires-python = ">=3.13"
dependencies = [
    "temporalio>=1.8.0",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    # aeon_evalops.runner (EVAL-002, not a test) parses evals/suites/*.yaml at runtime — not dev-only.
    "pyyaml>=6.0",
    # aeon_adapters.langgraph (INT-001, Modo B) runs a real compiled LangGraph graph.
    "langgraph>=1.0",
    # aeon_adapters.crewai (INT-004, Modo B) runs a real crewai.Crew.
    "crewai>=1.15",
    # aeon_adapters.openai_agents (INT-005, Modo B) runs a real agents.Agent/agents.Runner loop.
    # Pinned below 0.21 deliberately: openai-agents jumped its own "openai" dependency from <3 to
    # >=3.0.0 at 0.21.0, which conflicts with crewai's own openai<3 pin above — a real, currently
    # unresolvable version conflict between these two frameworks' dependency trees (see backlog.md).
    "openai-agents>=0.20,<0.21",
    # aeon_adapters.microsoft_agent_framework (INT-006, Modo B) runs a real agent_framework.Agent
    # loop. Only the core + openai subpackages, not the "agent-framework" meta package — that meta
    # package pulls in ~30 provider integrations (Anthropic, Bedrock, Gemini, Azure, Redis, mem0,
    # ...) Aeon never uses, the same over-installation problem crewai's dependency footprint already
    # showed (see backlog.md).
    "agent-framework-core>=1.15",
    # OBS-006b: Argus's own SDK, which is the right call and not what I argued for first.
    #
    # I had written plain OTLP and claimed the integration was "an endpoint plus two attribute names".
    # Reading their code showed that is wrong: argus-obs-semconv carries the VALUES and the companion
    # attributes, not just the keys. Their `argus.guardrail` is a COMMA-SEPARATED LIST and comes with
    # `argus.hot`; their guardrail kinds are hyphenated (`tool-call-budget`, `cost-budget`); and
    # `GenAISpan`/`Step` already model what Aeon spent three features building names for — `Step.outcome()`
    # is INT-011's outcome, `usage(input_tokens, output_tokens, cached_input_tokens)` is MDL-014's
    # three-state counters, and `backend(circuit_state=, fallback=, backend_id=)` is A5 and OBS-005.
    #
    # Hand-rolling the attribute names would have produced telemetry that looks right and that their alert
    # rules and dashboards do not match — the most expensive kind of nearly-correct.
    #
    # The [http] extra, not [all]: we want the OTLP/HTTP exporter and NOT the auto-instrumentation
    # packages, because every span Aeon emits is created deliberately and auto-instrumentation would add a
    # second, differently-named span per HTTP call.
    # a12 pinned as a FLOOR, not because we administer objects (that is a12's headline) but because a10
    # closed the vocabularies and a11 added `suspended` to argus.outcome — the value INT-011's waiting
    # step needs, and the answer to a question we asked them.
    "argus-obs-sdk[http]>=1.0.0a12",
    "agent-framework-openai>=1.14",
    # aeon_adapters.claude_agent_sdk (INT-007, Modo B) runs a real claude_agent_sdk.ClaudeSDKClient
    # turn loop. This package is a thin wrapper around the real `claude` (Claude Code) CLI (spawned
    # as a subprocess, not reimplemented) — the actual `@anthropic-ai/claude-code` npm CLI must be on
    # PATH; see deploy/compose/Dockerfile.python and Makefile's test-python target.
    "claude-agent-sdk>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "referencing>=0.35",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "aeon_observability",
    "aeon_sdk",
    "aeon_worker",
    "aeon_context",
    "aeon_evidence",
    "aeon_memory",
    "aeon_adapters",
    "aeon_profiles",
    "aeon_evalops",
]
