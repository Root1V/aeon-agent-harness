[project]
name = "aeon-worker"
version = "0.1.0"
description = "Aeon agent harness — Temporal worker, context/evidence/memory layers, Deep Research profile."
requires-python = ">=3.13"
dependencies = [
    "temporalio>=1.8.0",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    # aeon_evalops.runner (EVAL-002, not a test) parses evals/suites/*.yaml at runtime — not dev-only.
    "pyyaml>=6.0",
    # aeon_adapters.langgraph (INT-001, Modo B) runs a real compiled LangGraph graph.
    "langgraph>=1.0",
    # aeon_adapters.crewai (INT-004, Modo B) runs a real crewai.Crew.
    "crewai>=1.15",
    # aeon_adapters.openai_agents (INT-005, Modo B) runs a real agents.Agent/agents.Runner loop.
    # Pinned below 0.21 deliberately: openai-agents jumped its own "openai" dependency from <3 to
    # >=3.0.0 at 0.21.0, which conflicts with crewai's own openai<3 pin above — a real, currently
    # unresolvable version conflict between these two frameworks' dependency trees (see backlog.md).
    "openai-agents>=0.20,<0.21",
    # aeon_adapters.microsoft_agent_framework (INT-006, Modo B) runs a real agent_framework.Agent
    # loop. Only the core + openai subpackages, not the "agent-framework" meta package — that meta
    # package pulls in ~30 provider integrations (Anthropic, Bedrock, Gemini, Azure, Redis, mem0,
    # ...) Aeon never uses, the same over-installation problem crewai's dependency footprint already
    # showed (see backlog.md).
    "agent-framework-core>=1.15",
    "agent-framework-openai>=1.14",
    # aeon_adapters.claude_agent_sdk (INT-007, Modo B) runs a real claude_agent_sdk.ClaudeSDKClient
    # turn loop. This package is a thin wrapper around the real `claude` (Claude Code) CLI (spawned
    # as a subprocess, not reimplemented) — the actual `@anthropic-ai/claude-code` npm CLI must be on
    # PATH; see deploy/compose/Dockerfile.python and Makefile's test-python target.
    "claude-agent-sdk>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "referencing>=0.35",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "aeon_sdk",
    "aeon_worker",
    "aeon_context",
    "aeon_evidence",
    "aeon_memory",
    "aeon_adapters",
    "aeon_profiles",
    "aeon_evalops",
]
