# Aeon development/reference stack. All components run in containers — no local toolchain needed.
#
# Profiles:
#   core       minimum to run a workflow: Temporal + its DB + Postgres/pgvector + MinIO
#   obs        adds OTel Collector + Tempo + Prometheus (metrics) + Grafana
#   local-llm  adds vLLM (OpenAI-compatible) for development without a dedicated GPU cloud account
#   full       core + obs + local-llm
#
# Usage: docker compose --profile full up -d   (or `make dev`)

name: aeon

x-common-env: &common-env
  AEON_TENANT_ID: "default"
  # OBS-006b: where the GO services export spans. They defaulted to otel-collector:4318 in code, so tracing
  # was on but always pointed at this stack's own collector — pointing the whole deployment at an Argus agent
  # meant editing four binaries' environments one by one, and I found that out by watching Argus's hot
  # counter not move on a denial that had definitely happened.
  #
  # One variable for the whole stack now. From a CONTAINER an Argus agent is host.docker.internal, because
  # the agent binds to 127.0.0.1 — measured, localhost from a container returns 000. See .env.example.
  AEON_OTEL_ENDPOINT: ${AEON_OTEL_ENDPOINT:-otel-collector:4318}

  # SEC-005: the caller bundle every Go service verifies bearer tokens against. REQUIRED — a service
  # without it refuses to start rather than serving unauthenticated, which is the whole point (see
  # go/internal/auth.MustLoadFromEnv). The bundle holds only SHA-256 hashes; the tokens themselves are
  # the callers' own secrets.
  #
  # The default points at the DEVELOPMENT bundle, whose tokens are public because they are committed.
  # Override both this and AEON_CALLER_TOKEN for anything reachable by anyone else.
  AEON_CALLERS_PATH: ${AEON_CALLERS_PATH:-/examples/deep-research/callers.yaml}

  # TOOL-009: where artifacts live. The worker writes here and the Tool Gateway's artifact.read reads
  # here; the gateway mounts it READ-ONLY, so a tool cannot write one even if a future bug tried.
  AEON_ARTIFACT_ROOT: ${AEON_ARTIFACT_ROOT:-/artifacts}

services:
  # ---- Durable execution -----------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.24
    profiles: ["core", "obs", "local-llm", "full"]
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: ["core", "obs", "local-llm", "full"]
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"

  temporal-db:
    image: postgres:17-alpine
    profiles: ["core", "obs", "local-llm", "full"]
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Application data: registries, evidence ledger, memory, runs, cost -----------------
  postgres:
    image: pgvector/pgvector:pg17
    profiles: ["core", "obs", "local-llm", "full"]
    environment:
      POSTGRES_USER: aeon
      POSTGRES_PASSWORD: aeon
      POSTGRES_DB: aeon
    ports:
      # Host-side port intentionally non-default (5442, not 5432): 5432 is commonly already taken
      # by another local project's Postgres. Container-internal port and AEON_PG_DSN (below) are
      # unaffected — only the host-side mapping changes.
      - "5442:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeon"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Artifact / observation store (offload target, CTX-003) ---------------------------
  minio:
    image: minio/minio:latest
    profiles: ["core", "obs", "local-llm", "full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aeon
      MINIO_ROOT_PASSWORD: aeon-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Observability (OBS-001, A4: OTel GenAI semantic conventions) ----------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["obs", "full"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      # Host-side ports are overridable and default well away from the OTLP defaults, same reasoning
      # as postgres above. Observed directly on a developer machine: another observability stack held
      # 4317/4318 AND 14317/14318, so this container failed to start and took two tracing tests with
      # it. That failure is easy to misread — the tests report "no such host" for otel-collector,
      # because the container never came up at all, and the real message is in compose's output
      # rather than the test's.
      #
      # Container-internal ports are unchanged, so everything inside the compose network (the test
      # container included) still reaches otel-collector:4318 by service name. These publications
      # exist only for a process running on the host; set the variables if these collide too.
      - "${AEON_OTLP_GRPC_PORT:-24317}:4317"  # OTLP gRPC
      - "${AEON_OTLP_HTTP_PORT:-24318}:4318"  # OTLP HTTP
    depends_on: [tempo]

  tempo:
    # Pinned (not :latest): v3.0 restructured compaction/retention config into a distributed
    # "backend_scheduler" model incompatible with this single-binary compose deployment's
    # tempo-config.yaml. 2.7.1 is the last release on the config schema this file uses.
    image: grafana/tempo:2.7.1
    profiles: ["obs", "full"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  prometheus-metrics:
    image: prom/prometheus:latest
    profiles: ["obs", "full"]
    volumes:
      - ./prometheus-metrics-config.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-metrics-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["obs", "full"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    depends_on: [tempo, prometheus-metrics]
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  # ---- Local LLM inference (development without a dedicated GPU cloud account) ----------
  # NOTE: the user's "Prometheus" inference platform is expected to be reachable separately
  # (see ADR-004); this vllm service is the *generic* openai_compatible fallback used in dev/CI
  # when no external local-inference endpoint is configured.
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["local-llm", "full"]
    command: ["--model", "${AEON_DEV_LOCAL_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}"]
    ports:
      - "8000:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface

  # ---- Aeon control plane and gateways (built from this repo, see deploy root Dockerfiles) ---
  controlplane:
    build:
      context: ../../go
      dockerfile: ../deploy/compose/Dockerfile.go
      args:
        CMD_PATH: ./cmd/aeon-controlplane
    profiles: ["core", "obs", "local-llm", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      AEON_PG_DSN: postgres://aeon:aeon@postgres:5432/aeon?sslmode=disable
      # MEM-001's provenance_hmac key. Insecure dev-only default so `make dev` works out of the
      # box — set a real AEON_MEMORY_HMAC_KEY in .env for anything beyond local development.
      AEON_MEMORY_HMAC_KEY: "${AEON_MEMORY_HMAC_KEY:-dev-only-insecure-memory-hmac-key-change-me}"
    env_file:
      - path: ../../.env
        required: false
    volumes:
      # SEC-005: the caller bundle (AEON_CALLERS_PATH). Read-only, like the policy bundle beside it.
      - ../../examples:/examples:ro
    ports:
      - "9401:9401"

  modelgw:
    build:
      context: ../../go
      dockerfile: ../deploy/compose/Dockerfile.go
      args:
        CMD_PATH: ./cmd/aeon-modelgw
    profiles: ["core", "obs", "local-llm", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      # INT-002 (Modo C): resolves POST /v1/chat/completions's "model" (a capability profile) to
      # real candidates — config-as-code, same file aeon_sdk.model_policy resolves on the Python
      # side. Optional: without it /decide still works, only /v1/chat/completions is affected.
      AEON_MODEL_POLICY_BUNDLE_PATH: /examples/deep-research/model_policy_bundle.yaml
      # OBS-003: durable FinOps cost ledger + GET /finops/costs dashboard. Optional — without it,
      # /decide still computes and returns cost_usd per call, it just isn't recorded anywhere.
      AEON_PG_DSN: postgres://aeon:aeon@postgres:5432/aeon?sslmode=disable
      # MDL-006: the Prometheus URLs in .env are written for host-side use (127.0.0.1), which
      # inside a container means the container itself — verified: unreachable. These override them
      # with the host's view of the same service, and stay overridable for a deployment where
      # Prometheus is not on the developer's machine. Both values are the same service seen from a
      # different network namespace, not different endpoints.
      PROMETHEUS_AUTH_URL: "${PROMETHEUS_AUTH_URL_IN_CONTAINER:-http://host.docker.internal:9000}"
      PROMETHEUS_GATEWAY_URL: "${PROMETHEUS_GATEWAY_URL_IN_CONTAINER:-http://host.docker.internal:8020}"
    env_file:
      - path: ../../.env
        required: false
    extra_hosts:
      # Docker Desktop provides this automatically; Linux hosts need it declared.
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../examples:/examples:ro
    ports:
      - "9402:9402"

  # TOOL-007: search.web's provider. Self-hosted on purpose — the query is written by the model
  # from the run's context, so it can carry fragments of whatever the run is reading, and sending
  # that to a commercial search API puts it in a third party's logs. Running the searcher inside the
  # compose network keeps the query in the deployment; the engines it federates see the query and
  # never the run.
  #
  # Brave was the obvious alternative and is no longer free (metered billing, card required, no
  # spending cap as of early 2026). The Searcher interface exists so a deployment that prefers a
  # paid provider can swap this out without touching the harness.
  searxng:
    image: searxng/searxng:latest
    profiles: ["core", "obs", "local-llm", "full"]
    environment:
      # SearXNG builds absolute URLs from this; it must match how toolgw reaches it.
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      # The JSON API is off by default — this file turns it on. See searxng/settings.yml.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      # Published for debugging a query by hand; nothing in Aeon uses the host port. Overridable
      # because 8080 is the single most contended port on a developer machine.
      - "${AEON_SEARXNG_PORT:-18080}:8080"
    healthcheck:
      # Checks the JSON API specifically, not just that the process is up: a misconfigured
      # settings.yml serves HTML happily and answers 403 to exactly the request we depend on.
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8080/search?q=ping&format=json' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  toolgw:
    build:
      context: ../../go
      dockerfile: ../deploy/compose/Dockerfile.go
      args:
        CMD_PATH: ./cmd/aeon-toolgw
    profiles: ["core", "obs", "local-llm", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_healthy
    environment:
      <<: *common-env
      AEON_PG_DSN: postgres://aeon:aeon@postgres:5432/aeon?sslmode=disable
      # TOOL-007: with this unset, search.web is not registered at all and a call to it fails with
      # "unknown tool" — which is the point. It replaced a stub that answered successfully and
      # searched nothing.
      AEON_WEBSEARCH_SEARXNG_URL: http://searxng:8080
      # Config-as-code (FND-003): the policy bundle is a file in Git, mounted read-only, not baked
      # into the image. Point this at a different bundle to authorize a different set of agents.
      AEON_POLICY_BUNDLE_PATH: /examples/deep-research/policy_bundle.yaml
      # TOOL-008: what repository.read may read. Mounted READ-ONLY below, and the tool is contained by
      # os.Root on top of that — two independent guarantees, because the mount protects the host and
      # os.Root protects everything outside this directory on the gateway's own filesystem.
      AEON_REPOSITORY_ROOT: /repository
      # SEC-002: comma-separated names the Secret Broker loads from AEON_SECRET_<NAME> env vars
      # (see .env.example) — optional, empty until a real tool needs a credential.
      AEON_SECRET_NAMES: "${AEON_SECRET_NAMES:-}"
    env_file:
      - path: ../../.env
        required: false
    volumes:
      # TOOL-009: the artifact store, shared between the worker (which writes) and the gateway (which
      # reads). A HOST directory and not a named volume on purpose: the integration test runs its own
      # worker in a third container that mounts the repository, so this is the only place all three can
      # see the same files. Gitignored.
      - ../../.artifacts:/artifacts:ro
      - ../../examples:/examples:ro
      # TOOL-008's root: `docs/`, and NOT the repository. Mounting the whole thing was the first
      # version, and a probe returned `.env` with PROMETHEUS_CLIENT_SECRET in it to a caller holding the
      # public development token. Whatever is mounted here is readable IN FULL by any agent policy
      # permits repository.read — that is the property to think about when changing this line.
      # `:ro` is not the tool's containment (os.Root is); it is the second, independent one.
      - ../../docs:/repository:ro
      # TOOL-003: go/internal/sandbox spawns real, isolated containers for shell.exec via the host
      # Docker daemon (sibling containers, not nested Docker-in-Docker) — this grants toolgw
      # root-equivalent access to the host. Real, current tradeoff, not a mistake: SEC-002's Secret
      # Broker doesn't cover this socket — there's no credential isolation for it yet (see
      # backlog.md).
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9403:9403"

  worker:
    build:
      context: ../../python
      dockerfile: ../deploy/compose/Dockerfile.python
    profiles: ["core", "obs", "local-llm", "full"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      # TOOL-004: this stack's worker still uses the ledger that executes nothing, and says so out
      # loud rather than defaulting to it. Flipping it to AEON_TOOLGW_ADDR waits for real tools
      # (TOOL-006/TOOL-007) and for the Go executor to register artifact.write, which it does not.
      #
      # What changed with INT-010: the bundle now DOES name artifact.write, with
      # disposition require_approval — so in gateway mode the call would be refused until a person
      # approves, which is the intended behaviour and not a blocker. The line above used to say the
      # bundle did not allow it at all; that stopped being true on 2026-09-27.
      AEON_TOOL_EXECUTION_MODE: local-ledger
      <<: *common-env
      AEON_TEMPORAL_ADDRESS: temporal:7233
      # OBS-006b: the worker runs Argus's own SDK (argus-obs-sdk), so these are ITS variables.
      #
      # ARGUS_PROTOCOL IS PINNED, and that is not tidiness. Their Config auto-detects the protocol from the
      # installed exporter packages, and this image has both the HTTP and the gRPC exporters on disk (other
      # dependencies pull grpc in). It picked gRPC, then spoke gRPC at port 4318 — the HTTP port — and every
      # export failed with StatusCode.UNAVAILABLE in a retry loop. An auto-detected protocol plus an
      # explicitly configured port is a combination that CAN disagree, and it fails at runtime, not at start.
      ARGUS_PROTOCOL: ${ARGUS_PROTOCOL:-http/protobuf}
      ARGUS_ENDPOINT: ${ARGUS_ENDPOINT:-http://otel-collector:4318}
      # THE IDENTITY TRIPLE, and it is not cosmetic. Argus's gateway fills a missing service.namespace
      # with `unregistered`, and an unregistered application enters their registry with NO notification
      # channels — so its incidents go to their own console log and reach nobody. They found our policy
      # denial sitting there. The component name drops the `aeon-` prefix because the namespace already
      # says it; repeating it is the same redundancy their check caught in our test client.
      ARGUS_NAMESPACE: ${ARGUS_NAMESPACE:-aeon-ai}
      ARGUS_SERVICE: worker
      # `development`, from the OTel STANDARD's closed set (production|staging|test|development), and not
      # the `local` this said until 2026-09-30. Argus looked the vocabulary up instead of inventing one and
      # found the four teams sending `mac-dev`, `local`, `local` and `bare-metal` — four values for the same
      # laptop, so the field had looked like it distinguished something purely by having four values in it.
      # "Where does this run" is `host.name`, which the agent sets.
      ARGUS_ENVIRONMENT: ${ARGUS_ENVIRONMENT:-development}
      ARGUS_ROLE: worker
      # SEC-005: the worker is a CALLER, not a verifier — it carries its own credential and never sees
      # the bundle of everyone's hashes. The default is the development token, which is public because
      # it is committed in examples/deep-research/callers.yaml. Override it anywhere that matters.
      #
      # Its caller entry has mayApprove: false, deliberately. The worker is the process that gets
      # blocked on an approval, and a credential that could both run the tool and approve it would make
      # the gate a formality.
      AEON_CALLER_TOKEN: ${AEON_CALLER_TOKEN:-dev-worker-token-not-a-secret}
      # ARGUS'S CONVENTION IS LOCALHOST: an application exports to a per-machine agent on localhost and never
      # learns the central plane's address. This compose stack has no per-machine agent, so the collector's
      # service name is what exists here. Pointing at a real Argus agent is these two variables and nothing
      # else — and from a CONTAINER that address must be host.docker.internal, because the agent binds to
      # 127.0.0.1 (measured: localhost from a container returns 000). See .env.example.
      AEON_SERVICE_NAME: worker
      AEON_MODELGW_ADDR: modelgw:9402
      # DX-001's Deep Research Activities import aeon_profiles/aeon_worker modules that load JSON
      # Schemas from proto/ at import time — proto/ isn't in this image's build context (see
      # Dockerfile.python: context is python/ alone), so it must be mounted and pointed to here,
      # or the worker crashes on startup before ever connecting to Temporal.
      AEON_SCHEMAS_DIR: /proto
      # AEON_TOOLGW_ADDR lived here and the worker never read it — declared wiring that did nothing,
      # which is how the gap TOOL-004 fixes stayed invisible. It comes back the day this stack can
      # run the example's tools for real: today artifact.write is neither registered in the Go
      # executor nor permitted by policy_bundle.yaml, so pointing the worker at the gateway now
      # would turn a passing suite into a denied one without any tool becoming more real.
    volumes:
      # TOOL-009: the artifact store, shared between the worker (which writes) and the gateway (which
      # reads). A HOST directory and not a named volume on purpose: the integration test runs its own
      # worker in a third container that mounts the repository, so this is the only place all three can
      # see the same files. Gitignored.
      - ../../.artifacts:/artifacts
      - ../../proto:/proto:ro

  runcontroller:
    build:
      context: ../../go
      dockerfile: ../deploy/compose/Dockerfile.go
      args:
        CMD_PATH: ./cmd/aeon-runcontroller
    profiles: ["core", "obs", "local-llm", "full"]
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      AEON_TEMPORAL_ADDRESS: temporal:7233
      # A5: lets checkNotQuarantined refuse a run for a quarantined agent version before Temporal is
      # ever touched. Optional — see go/cmd/aeon-runcontroller/main.go's module doc.
      AEON_PG_DSN: postgres://aeon:aeon@postgres:5432/aeon?sslmode=disable
      # OBS-002: Agent Console's trace panel. Optional — under --profile core alone (no Tempo
      # running), the console still serves run status; the trace panel just reports a query error.
      AEON_TEMPO_QUERY_URL: http://tempo:3200
    volumes:
      # SEC-005: the caller bundle (AEON_CALLERS_PATH). Read-only, like the policy bundle beside it.
      - ../../examples:/examples:ro
    ports:
      - "9404:9404"

volumes:
  temporal-db-data:
  postgres-data:
  minio-data:
  tempo-data:
  prometheus-metrics-data:
  grafana-data:
  vllm-cache:
