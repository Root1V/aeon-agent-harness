# SEC-006: the same stack with its secrets delivered as FILES instead of environment variables.
#
#   make dev-secret-files            # creates deploy/compose/secrets/* (gitignored)
#   docker compose --env-file .env \
#     -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/secrets.override.yml --profile core up -d --build
#
# WHY A SEPARATE FILE. The base stack has to come up on a fresh clone with no provisioning step, so
# its credentials arrive through the environment and `make dev` works. This override is the path for
# a deployment where the keys are not yours — and the difference between the two is not a preference,
# it is measurable:
#
#   environment  value is in `docker inspect`, in /proc/<pid>/environ for the life of the process,
#                and in the environment of every child process. Unsetting it in code closes the
#                last of those three and NOT the first two: /proc/<pid>/environ reports the block
#                the process was exec'd with and is not rewritten by unsetenv (measured; see
#                docs/secrets.md).
#   file         never in any of the three. Readable by whatever can read the path, which is a mount
#                decision the deployment makes.
#
# EVERY `<NAME>: ""` BELOW IS LOAD-BEARING, not tidiness. go/internal/secretref REFUSES to start a
# service that has both <NAME> and <NAME>_FILE set, because two sources for one secret means a
# rotation can be applied to the one that loses and nothing fails. The base stack supplies <NAME>
# from .env, so this override has to clear it — compose's `environment` has no "unset", and an empty
# value is what secretref reads as "not configured".
#
# The three secrets here are the ones the REFERENCE deployment uses. A deployment with no Prometheus
# account deletes those four lines and the `prometheus_client_secret` entry; a deployment with an
# Anthropic key adds `anthropic_api_key` the same way. `make dev-secret-files` refuses to write an
# empty file, so a secret you have not provisioned fails at `up` with the file named, rather than at
# the first model call with a 401.

secrets:
  memory_hmac_key:
    file: ./secrets/memory_hmac_key
  caller_token:
    file: ./secrets/caller_token
  prometheus_client_secret:
    file: ./secrets/prometheus_client_secret

services:
  controlplane:
    environment:
      AEON_MEMORY_HMAC_KEY: ""
      AEON_MEMORY_HMAC_KEY_FILE: /run/secrets/memory_hmac_key
    secrets:
      - memory_hmac_key

  modelgw:
    environment:
      PROMETHEUS_CLIENT_SECRET: ""
      PROMETHEUS_CLIENT_SECRET_FILE: /run/secrets/prometheus_client_secret
    secrets:
      - prometheus_client_secret

  toolgw:
    environment:
      PROMETHEUS_CLIENT_SECRET: ""
      PROMETHEUS_CLIENT_SECRET_FILE: /run/secrets/prometheus_client_secret
    secrets:
      - prometheus_client_secret

  worker:
    environment:
      # The worker is the sharpest case for the file path and the reason the Python side of
      # secretref exists: it spawns the `claude` CLI with {**os.environ, **options.env}, so before
      # SEC-006 a third-party binary received the credential that lets you call the Tool Gateway as
      # this agent. The file path means the value is never in the environment to inherit.
      AEON_CALLER_TOKEN: ""
      AEON_CALLER_TOKEN_FILE: /run/secrets/caller_token
    secrets:
      - caller_token
