# Minimal OTel Collector pipeline: receive OTLP from Go/Python components, export traces to Tempo
# and metrics to Prometheus-metrics. Spans are expected to follow the OTel GenAI semantic
# conventions (invoke_agent / chat / execute_tool) — see proto/schemas/trace_event.schema.json.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # OBS-006b: the Argus SDK exports LOGS as well as traces and metrics, and our pipeline had no logs path —
  # so every worker emitted "Failed to export logs batch code: 404" in a retry loop. Harmless to the traces
  # and noisy enough to hide a real error, which is the part that matters: a log full of a known failure is
  # a log nobody reads.
  #
  # Dropped rather than stored, and stated rather than silently accepted: this dev stack has no log backend
  # (Argus's own has one), so accepting and discarding is the honest behaviour for it. A deployment pointing
  # at a real Argus agent never reaches this pipeline.
  nop: {}
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [nop]
